server {
    listen 80;
    server_name sahayogai.in www.sahayogai.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sahayogai.in www.sahayogai.in;

    ssl_certificate /etc/letsencrypt/live/sahayogai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sahayogai.in/privkey.pem;

    root /var/www/sahayogai;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
